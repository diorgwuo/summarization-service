spring.application.name=summarization-server
server.port=8083
spring.config.import=file:.env[.properties]

yandex.api.key=${YANDEX_API_KEY}
yandex.folder.id=${FOLDER_ID}
yandex.model.ai=${YANDEX_MODEL_AI}

bootstrap.server=localhost:9092
group.id=summarization-server-group
trusted.packages=com.yuldashov.summarizationserver.dto,com.yuldashov.scheduler.dto
response.type=com.yuldashov.summarizationserver.dto.summarization.SummarizationRequest
container.name=summarization-reply

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=summarization-server-group
spring.kafka.properties.spring.json.trusted.packages=com.yuldashov.summarizationserver.dto,com.yuldashov.scheduler.dto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.yuldashov.summarizationserver.dto.SummarizationRequest