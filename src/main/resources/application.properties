spring.application.name=summarization-server
server.port=8083
spring.config.import=optional:file:.env[.properties]

yandex.api.key=${YANDEX_API_KEY}
yandex.folder.id=${FOLDER_ID}
yandex.model.ai=${YANDEX_MODEL_AI}
yandex.ai.url=https://ai.api.cloud.yandex.net/v1/

bootstrap.server=kafka:9092
group.id=summarization-server-group
trusted.packages=com.yuldashov.summarizationserver.dto,com.yuldashov.scheduler.dto
response.type=com.yuldashov.summarizationserver.dto.summarization.SummarizationRequest
container.name=summarization-reply

spring.kafka.bootstrap-servers=localhost:9092